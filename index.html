<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ママお誕生日おめでとう！</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    /* 背景：パステル調の虹色グラデーション */
    body {
      text-align: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7, #ffdde1, #a8edea, #fed6e3, #d4fc79);
      background-size: 400% 400%;
      animation: rainbowBG 15s ease infinite;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding-bottom: 50px;
      margin: 0;
    }

    @keyframes rainbowBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* タイトル：ピンク色 */
    h1 {
      color: #ff1493;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
      font-size: 2.2rem;
      margin-top: 20px;
    }

    /* キャラクター表示エリア */
    .character-container {
      display: inline-block;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .character-container:hover {
      transform: scale(1.05);
    }

    /* 跳ねるアニメーション */
    .jump {
      animation: jump-up 0.5s ease;
    }
    @keyframes jump-up {
      0%   { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-50px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* クイズコーナー */
    .quiz-container {
      max-width: 500px;
      margin: 30px auto 20px;
      padding: 25px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }
    .quiz-header {
      color: #ff69b4;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .quiz-question {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .quiz-option {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 1rem;
      background-color: #fff0f5;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-option:hover {
      background-color: #ffc0cb;
      transform: scale(1.02);
    }
    #quizResult {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.2rem;
      min-height: 1.5em;
    }
    .btn-next {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #2ed573;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <h1>ママ、お誕生日おめでとう！</h1>

  <!-- 新しいオリジナルキャラクター（クリックでジャンプ＆花火） -->
  <div id="myChara" class="character-container" onclick="charaAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="160" height="213">
      <!-- 両手（バンザイ） -->
      <path d="M 65,115 C 20,100 15,45 60,70 Q 70,80 75,100 Z" fill="#FFF3D6" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 175,115 C 220,100 225,45 180,70 Q 170,80 165,100 Z" fill="#FFF3D6" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
      
      <!-- 体と足 -->
      <path d="M 120,20 
               C 185,20 185,140 185,210 
               C 185,280 165,305 140,305 
               C 122,305 120,270 120,230 
               C 120,270 118,305 100,305 
               C 75,305 55,280 55,210 
               C 55,140 55,20 120,20 Z" 
            fill="#FFF3D6" stroke="#222" stroke-width="6" stroke-linejoin="round"/>

      <!-- お腹の2本ライン（赤い模様） -->
      <path d="M 58,105 Q 120,135 182,110 Q 120,115 58,105 Z" fill="#D81B27"/>
      <path d="M 57,145 Q 120,175 183,150 Q 120,155 57,145 Z" fill="#D81B27"/>

      <!-- 股の仕切り線 -->
      <line x1="120" y1="230" x2="120" y2="300" stroke="#222" stroke-width="6" stroke-linecap="round"/>

      <!-- つぶらな目（縦線2本） -->
      <line x1="102" y1="42" x2="102" y2="52" stroke="#222" stroke-width="5" stroke-linecap="round"/>
      <line x1="114" y1="42" x2="114" y2="52" stroke="#222" stroke-width="5" stroke-linecap="round"/>

      <!-- にっこり口 -->
      <path d="M 85,55 Q 110,85 130,58" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>

  <p>キャラクターをタップするか、ボタンを押してね！</p>
  <button onclick="charaAction()" style="padding: 12px 25px; font-size: 1.2rem; background-color: #ff69b4; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">🎆 お祝いする！</button>

  <!-- クイズコーナー（3問形式） -->
  <div class="quiz-container">
    <div class="quiz-header" id="quizNum">🧩 ママクイズ (1/3問) 🧩</div>
    <div class="quiz-question" id="quizQuestion">第1問：ママが一番好きな食べものはどれでしょう？</div>
    
    <div id="quizOptions">
      <!-- 選択肢 -->
    </div>

    <div id="quizResult"></div>
    <button id="nextBtn" class="btn-next" onclick="nextQuiz()">次の問題へ ➔</button>
  </div>

  <script>
    // 金銀＋華やかカラーの豪華花火演出
    function charaAction() {
      const chara = document.getElementById('myChara');
      chara.classList.add('jump');

      const colorfulGlitters = [
        '#FFD700', '#C0C0C0', '#FFFFFF',
        '#FF007F', '#FF69B4', '#FF1493',
        '#00F5D4', '#7B2CBF', '#FF9E00',
        '#00BBF9', '#F15BB5', '#FEE440'
      ];

      // 中央爆発（250発）
      confetti({
        particleCount: 250,
        spread: 140,
        startVelocity: 60,
        scalar: 0.45,
        ticks: 300,
        origin: { y: 0.6 },
        colors: colorfulGlitters
      });

      // 左右からの打ち上げ（各150発）
      confetti({
        particleCount: 150,
        angle: 60,
        spread: 90,
        startVelocity: 65,
        scalar: 0.4,
        origin: { x: 0, y: 0.8 },
        colors: colorfulGlitters
      });

      confetti({
        particleCount: 150,
        angle: 120,
        spread: 90,
        startVelocity: 65,
        scalar: 0.4,
        origin: { x: 1, y: 0.8 },
        colors: colorfulGlitters
      });

      // 時間差追撃（100発）
      setTimeout(() => {
        confetti({
          particleCount: 100,
          spread: 180,
          startVelocity: 30,
          scalar: 0.5,
          ticks: 200,
          origin: { y: 0.2 },
          colors: colorfulGlitters
        });
      }, 150);

      setTimeout(() => {
        chara.classList.remove('jump');
      }, 500);
    }

    // クイズデータ
    const quizData = [
      {
        question: "第1問：ママが一番好きな食べものはどれでしょう？",
        options: [
          { text: "1. ラーメン", correct: false },
          { text: "2. ハンバーグ", correct: true },
          { text: "3. お寿司", correct: false }
        ]
      },
      {
        question: "第2問：ママが一番好きな色は何色でしょう？",
        options: [
          { text: "1. ピンク", correct: true },
          { text: "2. 青", correct: false },
          { text: "3. きいろ", correct: false }
        ]
      },
      {
        question: "第3問：ママが休みにしたいことはどれでしょう？",
        options: [
          { text: "1. お買い物", correct: false },
          { text: "2. のんびりお昼寝", correct: true },
          { text: "3. お散歩", correct: false }
        ]
      }
    ];

    let currentQuiz = 0;

    function loadQuiz() {
      const q = quizData[currentQuiz];
      document.getElementById('quizNum').innerText = `🧩 ママクイズ (${currentQuiz + 1}/3問) 🧩`;
      document.getElementById('quizQuestion').innerText = q.question;
      
      const optionsDiv = document.getElementById('quizOptions');
      optionsDiv.innerHTML = "";
      document.getElementById('quizResult').innerText = "";
      document.getElementById('nextBtn').style.display = "none";

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "quiz-option";
        btn.innerText = opt.text;
        btn.onclick = () => checkAnswer(opt.correct);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(isCorrect) {
      const result = document.getElementById('quizResult');
      if (isCorrect) {
        result.innerText = "大正解！🎉 すごい！";
        result.style.color = "#ff1493";
        charaAction();

        if (currentQuiz < quizData.length - 1) {
          document.getElementById('nextBtn').style.display = "inline-block";
        } else {
          result.innerText = "全問正解！🎉 ママ、いつもありがとう！！❤️";
        }
      } else {
        result.innerText = "ざんねん！もう一回かんがえてみてね！";
        result.style.color = "#dc143c";
      }
    }

    function nextQuiz() {
      currentQuiz++;
      loadQuiz();
    }

    loadQuiz();
  </script>

</body>
</html>
