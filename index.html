<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ままたん にんどとうひろば</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffdf5;color:#222;font-family:"Yu Gothic",sans-serif;text-align:center}
header{padding:12px 10px 4px}
h1{font-size:clamp(22px,4vw,38px);margin:4px}
p{margin:6px 0 12px}
.scene{position:relative;width:min(100%,850px);margin:0 auto;overflow:hidden;line-height:0;background:white}
#drawing{display:block;width:100%;height:auto;transform-origin:center;will-change:transform}
#drawing.wiggle{animation:wiggle .75s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-1deg) scale(1.01)}45%{transform:rotate(1deg) scale(1.01)}70%{transform:rotate(-.6deg)}}
button{font-family:inherit;font-size:clamp(15px,2.6vw,20px);font-weight:bold;border:3px solid #222;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:0 4px #222;background:#fff32b}
button:active{transform:translateY(3px);box-shadow:0 1px #222}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#fireBtn{position:absolute;left:39.5%;top:32%;transform:translate(-50%,-50%);width:clamp(42px,7vw,76px);height:clamp(48px,8vw,82px);padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;z-index:8;line-height:0;overflow:visible} #fireBtn img{width:100%;height:100%;object-fit:contain;display:block} #fireBtn:active{transform:translate(-50%,-48%) scale(.92);box-shadow:none}
#fireBtn:active{transform:translate(-50%,-50%);filter:brightness(.85)} #fireBtn img{pointer-events:none;-webkit-user-drag:none;user-select:none} #fireBtn::after{content:"";position:absolute;inset:-14px;border-radius:50%}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px 10px 22px}
#mazeBtn{background:#d8f4ff}#wireBtn{background:#ffd8ed}
.burst{position:absolute;z-index:10;pointer-events:none;line-height:1;font-size:clamp(18px,3vw,34px);animation:burst 1.5s cubic-bezier(.12,.65,.2,1) forwards;will-change:transform,opacity}.burst.flash{animation:flash 1.15s ease-out forwards}@keyframes flash{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}35%{transform:translate(-50%,-50%) scale(2.2);opacity:1}100%{transform:translate(-50%,-50%) scale(.3);opacity:0}}
@keyframes burst{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:1}65%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.5) rotate(250deg);opacity:0}}
.panel{display:none;width:min(850px,calc(100% - 20px));margin:0 auto 30px;padding:16px;border:3px solid #222;border-radius:14px;background:white;line-height:1.4}
.panel.visible{display:block}
.maze{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:0;max-width:520px;margin:12px auto;border:3px solid #222;border-radius:6px;overflow:hidden}
.cell{aspect-ratio:1;border:1px solid #e6e6e6;background:#fff}.wall{background:#333;border-color:#333}.start{background:#65e45c}.goal{background:#ffde39}.player{background:#4bb8ff;box-shadow:inset 0 0 0 3px #075b9a}
.game-row{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.game-row button{font-size:16px;padding:7px 13px}
#wireCanvas{width:100%;max-width:700px;height:auto;border:2px solid #333;border-radius:10px;touch-action:none;background:#fffdf5}
#fxLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:100}
.congrats{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;font-weight:900;color:var(--c);text-shadow:-2px 0 #222,2px 0 #222,0 -2px #222,0 2px #222,-2px -2px #222,2px -2px #222,-2px 2px #222,2px 2px #222;opacity:0;animation:spout var(--t) both;will-change:transform,opacity}
@keyframes spout{0%{transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(.3);opacity:0;animation-timing-function:cubic-bezier(.15,.75,.35,1)}12%{opacity:1}45%{transform:translate(calc(var(--x) + var(--dx)*.55),calc(var(--y) + var(--up))) translate(-50%,-50%) scale(1) rotate(calc(var(--rot)*.5));opacity:1;animation-timing-function:cubic-bezier(.55,.05,.9,.5)}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--down))) translate(-50%,-50%) scale(.9) rotate(var(--rot));opacity:0}}
#fireZone{position:absolute;left:50%;top:34.7%;width:18%;height:5%;min-width:84px;min-height:42px;transform:translate(-50%,-50%);padding:0;border:0;border-radius:8px;background:transparent;box-shadow:none;z-index:8}#fireZone:active{transform:translate(-50%,-50%);box-shadow:none;background:rgba(255,255,255,.25)}
.congrats.fw{animation-name:fwpop;animation-timing-function:cubic-bezier(.1,.7,.3,1)}
@keyframes fwpop{0%{transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(.2);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) translate(-50%,-50%) scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>

<section class="panel" id="mazePanel">
<h2>🌀 めいろ</h2><p>青いプレイヤーを矢印ボタンでゴールへ動かそう！道は「48」のかたちだよ。</p>
<div class="maze" id="maze"></div>
<div class="game-row"><button data-move="up">⬆️</button><button data-move="left">⬅️</button><button data-move="down">⬇️</button><button data-move="right">➡️</button><button id="mazeReset">やりなおす</button></div>
<p id="mazeStatus">スタートからゴールをめざそう！</p>
</section>
<section class="panel" id="wirePanel">
<h2>⚡ イライラ棒</h2><p>指やマウスで黄色いコースをたどろう。線から外れると失敗！</p>
<canvas id="wireCanvas" width="700" height="260"></canvas>
<div class="game-row"><button id="wireReset">やりなおす</button></div><p id="wireStatus">緑のスタートを押さえたまま、なぞり始めてね。</p>
</section>
<script>
const scene=document.getElementById('scene'), drawing=document.getElementById('drawing');
const symbols=['✦','✧','★','✺','✹','❋','✨','💥','🎆','🎇'];
const fireColors=['#ff1744','#ff9100','#ffea00','#76ff03','#00e5ff','#2979ff','#d500f9','#ffffff','#ff4081'];
function fireworks(){
 const r=scene.getBoundingClientRect();
 const old=scene.querySelectorAll('.burst');if(old.length>500)for(let i=0;i<old.length-200;i++)old[i].remove();
 // Multiple large bursts with colorful rays, glowing stars, and trailing sparks.
 const bursts=7;
 for(let k=0;k<bursts;k++){
  const cx=8+Math.random()*84, cy=10+Math.random()*72;
  const count=34+Math.floor(Math.random()*22);
  const color=fireColors[Math.floor(Math.random()*fireColors.length)];
  for(let i=0;i<count;i++){
   const angle=(Math.PI*2*i/count)+(Math.random()-.5)*.12;
   const distance=55+Math.random()*Math.min(160,r.width*.22);
   const b=document.createElement('span');
   b.className='burst';
   b.textContent=['✦','✧','★','✺','✹','✨'][Math.floor(Math.random()*6)];
   b.style.left=(cx/100*r.width)+'px';
   b.style.top=(cy/100*r.height)+'px';
   b.style.color=(Math.random()<.45?color:fireColors[Math.floor(Math.random()*fireColors.length)]);
   b.style.fontSize=(12+Math.random()*25)+'px';
   b.style.textShadow='0 0 8px currentColor';
   b.style.setProperty('--dx',(Math.cos(angle)*distance)+'px');
   b.style.setProperty('--dy',(Math.sin(angle)*distance)+'px');
   b.style.animationDuration=(.9+Math.random()*.9)+'s';
   b.style.animationDelay=(Math.random()*.22)+'s';
   scene.appendChild(b);setTimeout(()=>b.remove(),2300);
  }
  // A bright center flash for each explosion.
  const flash=document.createElement('span');
  flash.className='burst flash';flash.textContent='✹';
  flash.style.left=(cx/100*r.width)+'px';flash.style.top=(cy/100*r.height)+'px';
  flash.style.color=color;flash.style.fontSize=(34+Math.random()*32)+'px';
  flash.style.textShadow='0 0 8px white,0 0 24px '+color+',0 0 44px '+color;
  flash.style.setProperty('--dx','0px');flash.style.setProperty('--dy','0px');
  scene.appendChild(flash);setTimeout(()=>flash.remove(),1300);
 }
 // A short glitter shower across the whole picture.
 for(let i=0;i<65;i++){
  const s=document.createElement('span');s.className='burst';s.textContent=Math.random()<.5?'✨':'•';
  s.style.left=Math.random()*r.width+'px';s.style.top=Math.random()*r.height+'px';
  s.style.color=fireColors[Math.floor(Math.random()*fireColors.length)];
  s.style.fontSize=(10+Math.random()*20)+'px';
  s.style.setProperty('--dx',((Math.random()-.5)*100)+'px');
  s.style.setProperty('--dy',(35+Math.random()*130)+'px');
  s.style.animationDelay=(Math.random()*.45)+'s';
  scene.appendChild(s);setTimeout(()=>s.remove(),2400);
 }
 drawing.classList.remove('wiggle');void drawing.offsetWidth;drawing.classList.add('wiggle');
}
document.getElementById('fireBtn').addEventListener('click',fireworks);document.getElementById('fireZone').addEventListener('click',fireworks);
drawing.addEventListener('click',e=>{if(e.detail===2)fireworks()});

const layout=['#############','#S##.##.....#','#.##.##.###.#','#.##.##.###.#','#.##.##.###.#','#...........#','####.##.###.#','####.##.###.#','####.##.###.#','####.##....G#','#############'];
function findCell(ch){for(let r=0;r<layout.length;r++){const c=layout[r].indexOf(ch);if(c>=0)return{r,c}}return{r:1,c:1}}const startPos=findCell('S');
let player={...startPos},mazeWon=false;const maze=document.getElementById('maze');
function drawMaze(){maze.innerHTML='';layout.forEach((row,r)=>[...row].forEach((ch,c)=>{let el=document.createElement('div');el.className='cell';if(ch==='#')el.classList.add('wall');if(ch==='S')el.classList.add('start');if(ch==='G')el.classList.add('goal');if(player.r===r&&player.c===c)el.classList.add('player');maze.appendChild(el)}))}
function move(d){if(mazeWon)return;let v={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[d],r=player.r+v[0],c=player.c+v[1];if(r<0||r>=layout.length||c<0||c>=layout[0].length||layout[r][c]==='#')return;player={r,c};drawMaze();if(layout[r][c]==='G'){mazeWon=true;document.getElementById('mazeStatus').textContent='🎉 おめでとう！ ゴール！ やったね！';const g=maze.children[r*layout[0].length+c].getBoundingClientRect();congrats(g.left+g.width/2,g.top+g.height/2)}}
function resetMaze(){player={...startPos};mazeWon=false;document.getElementById('mazeStatus').textContent='スタートからゴールをめざそう！';drawMaze()}
drawMaze();document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));document.getElementById('mazeReset').onclick=resetMaze;
document.addEventListener('keydown',e=>{if(!document.getElementById('mazePanel').classList.contains('visible'))return;let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(m[e.key]){e.preventDefault();move(m[e.key])}});
function showPanel(name){document.getElementById('mazePanel').classList.toggle('visible',name==='maze');document.getElementById('wirePanel').classList.toggle('visible',name==='wire');if(name==='wire')drawWire();if(name)document.getElementById(name+'Panel').scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('mazeBtn').onclick=()=>showPanel('maze');document.getElementById('wireBtn').onclick=()=>showPanel('wire');

const canvas=document.getElementById('wireCanvas'),ctx=canvas.getContext('2d');
const track=[{x:35,y:130},{x:160,y:130},{x:160,y:55},{x:300,y:55},{x:300,y:205},{x:445,y:205},{x:445,y:95},{x:575,y:95},{x:575,y:130},{x:650,y:130}];
let active=false,won=false;
function drawWire(){ctx.clearRect(0,0,700,260);ctx.lineCap='round';ctx.lineJoin='round';for(const [color,width] of [['#222',24],['#f9e21b',14]]){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(track[0].x,track[0].y);track.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}ctx.fillStyle='#65df4e';ctx.beginPath();ctx.arc(35,130,13,0,7);ctx.fill();ctx.fillStyle='#ff4040';ctx.beginPath();ctx.arc(650,130,13,0,7);ctx.fill()}
function resetWire(){active=false;won=false;document.getElementById('wireStatus').textContent='緑のスタートを押さえたまま、なぞり始めてね。';drawWire()}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*700/r.width,y:(e.clientY-r.top)*260/r.height}}
function segmentDist(p,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
canvas.addEventListener('pointerdown',e=>{let p=point(e);if(Math.hypot(p.x-35,p.y-130)<30){active=true;won=false;canvas.setPointerCapture(e.pointerId);document.getElementById('wireStatus').textContent='線にそって進もう！'}});
canvas.addEventListener('pointermove',e=>{if(!active||won)return;let p=point(e),d=Math.min(...track.slice(1).map((q,i)=>segmentDist(p,track[i],q)));if(d>12){active=false;document.getElementById('wireStatus').textContent='💥 コースから外れた！ やりなおしてね。';return}ctx.fillStyle='#178be0';ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();if(Math.hypot(p.x-650,p.y-130)<18){won=true;active=false;document.getElementById('wireStatus').textContent='🎉 さすが！天才！ ゴール！';geniusFireworks()}});
canvas.addEventListener('pointerup',()=>{if(active&&!won){active=false;document.getElementById('wireStatus').textContent='指を離しちゃった！ やりなおしてね。'}});document.getElementById('wireReset').onclick=resetWire;
const cheerColors=['#ff1744','#ff6d00','#ffc400','#00c853','#00b0ff','#2962ff','#d500f9','#ff4081'];
function fxLayer(){let l=document.getElementById('fxLayer');if(!l){l=document.createElement('div');l.id='fxLayer';l.setAttribute('aria-hidden','true');document.body.appendChild(l)}return l}
function congrats(x,y){
 const layer=fxLayer(),vw=window.innerWidth,vh=window.innerHeight,maxSize=Math.min(46,vw/10);
 const wave=n=>{for(let i=0;i<n;i++){
  const s=document.createElement('span'),dur=2+Math.random()*.9,delay=Math.random()*.35;
  s.className='congrats';s.textContent=Math.random()<.15?'🎉':'おめでとう！';
  s.style.setProperty('--x',x+'px');s.style.setProperty('--y',y+'px');
  s.style.setProperty('--dx',((Math.random()-.5)*Math.min(vw*.9,720))+'px');
  s.style.setProperty('--up',(-(140+Math.random()*Math.min(vh*.55,320)))+'px');
  s.style.setProperty('--down',(30+Math.random()*170)+'px');
  s.style.setProperty('--rot',((Math.random()-.5)*50)+'deg');
  s.style.setProperty('--c',cheerColors[Math.floor(Math.random()*cheerColors.length)]);
  s.style.setProperty('--t',dur+'s');
  s.style.fontSize=(maxSize*(.55+Math.random()*.45))+'px';
  s.style.animationDelay=delay+'s';
  layer.appendChild(s);setTimeout(()=>s.remove(),(dur+delay)*1000+150);
 }};
 wave(24);setTimeout(()=>wave(16),420);
}
function geniusFireworks(){
 const layer=fxLayer(),vw=window.innerWidth,vh=window.innerHeight,fs=Math.min(30,vw/12);
 for(let k=0;k<9;k++)setTimeout(()=>{
  const cx=vw*(.15+Math.random()*.7),cy=vh*(.15+Math.random()*.45),n=11+Math.floor(Math.random()*4),color=cheerColors[Math.floor(Math.random()*cheerColors.length)];
  for(let i=0;i<n;i++){
   const a=Math.PI*2*i/n+(Math.random()-.5)*.25,dist=Math.min(vw*.4,110+Math.random()*120),dur=1.3+Math.random()*.6;
   const s=document.createElement('span');s.className='congrats fw';s.textContent=Math.random()<.2?'✨':'さすが！天才！';
   s.style.setProperty('--x',cx+'px');s.style.setProperty('--y',cy+'px');
   s.style.setProperty('--dx',Math.cos(a)*dist+'px');s.style.setProperty('--dy',Math.sin(a)*dist+'px');
   s.style.setProperty('--c',Math.random()<.6?color:cheerColors[Math.floor(Math.random()*cheerColors.length)]);
   s.style.setProperty('--t',dur+'s');s.style.fontSize=(fs*(.7+Math.random()*.4))+'px';
   layer.appendChild(s);setTimeout(()=>s.remove(),dur*1000+150);
  }
  const f=document.createElement('span');f.className='congrats fw';f.textContent='✹';f.style.setProperty('--x',cx+'px');f.style.setProperty('--y',cy+'px');f.style.setProperty('--dx','0px');f.style.setProperty('--dy','0px');f.style.setProperty('--c',color);f.style.setProperty('--t','.9s');f.style.fontSize=(fs*2.2)+'px';
  layer.appendChild(f);setTimeout(()=>f.remove(),1050);
 },k*230);
}
</script>
