<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ママお誕生日おめでとう！</title>
  <style>
    /* 背景：パステル調の虹色グラデーション */
    body {
      text-align: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7, #ffdde1, #a8edea, #fed6e3, #d4fc79);
      background-size: 400% 400%;
      animation: rainbowBG 15s ease infinite;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding-bottom: 50px;
      margin: 0;
      overflow-x: hidden;
    }

    @keyframes rainbowBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* タイトル */
    h1 {
      color: #ff1493;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
      font-size: 2.2rem;
      margin-top: 20px;
    }

    /* キャラクター表示エリア */
    .character-container {
      display: inline-block;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .character-container:hover {
      transform: scale(1.05);
    }

    /* 跳ねるアニメーション */
    .jump {
      animation: jump-up 0.5s ease;
    }
    @keyframes jump-up {
      0%   { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-50px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* 共通カードスタイル */
    .card-container {
      max-width: 500px;
      margin: 30px auto 20px;
      padding: 25px;
      background-color: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }

    .section-header {
      color: #ff69b4;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* クイズのスタイル */
    .quiz-question {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .quiz-option {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 1rem;
      background-color: #fff0f5;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-option:hover {
      background-color: #ffc0cb;
      transform: scale(1.02);
    }
    #quizResult {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.2rem;
      min-height: 1.5em;
    }
    .btn-next {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #2ed573;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: none;
    }

    /* 迷路のスタイル（難関化に伴い拡大） */
    .maze-wrapper {
      position: relative;
      width: 372px;
      height: 372px;
      margin: 15px auto;
      touch-action: none;
    }
    canvas#mazeCanvas {
      border: 4px solid #ffb6c1;
      border-radius: 15px;
      background-color: #ffffff;
      cursor: crosshair;
    }
    .maze-btn {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin: 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #mazeResult {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.4rem;
      color: #ff1493;
      min-height: 1.5em;
    }
    #mazeHint {
      font-size: 0.85rem;
      color: #e74c3c;
      font-weight: bold;
      min-height: 1.2em;
    }

    /* 全画面花火用キャンバス */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <!-- ド派手花火用キャンバス -->
  <canvas id="fireworksCanvas"></canvas>

  <h1>ママ、お誕生日おめでとう！</h1>

  <!-- キャラクター -->
  <div id="myChara" class="character-container" onclick="charaAction()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="160" height="213">
      <path d="M 65,115 C 20,100 15,45 60,70 Q 70,80 75,100 Z" fill="#FFF3D6" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 175,115 C 220,100 225,45 180,70 Q 170,80 165,100 Z" fill="#FFF3D6" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 120,20 C 185,20 185,140 185,210 C 185,280 165,305 140,305 C 122,305 120,270 120,230 C 120,270 118,305 100,305 C 75,305 55,280 55,210 C 55,140 55,20 120,20 Z" fill="#FFF3D6" stroke="#222" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 58,105 Q 120,135 182,110 Q 120,115 58,105 Z" fill="#D81B27"/>
      <path d="M 57,145 Q 120,175 183,150 Q 120,155 57,145 Z" fill="#D81B27"/>
      <line x1="120" y1="230" x2="120" y2="300" stroke="#222" stroke-width="6" stroke-linecap="round"/>
      <line x1="102" y1="42" x2="102" y2="52" stroke="#222" stroke-width="5" stroke-linecap="round"/>
      <line x1="114" y1="42" x2="114" y2="52" stroke="#222" stroke-width="5" stroke-linecap="round"/>
      <path d="M 85,55 Q 110,85 130,58" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>

  <p>タップしてね！</p>
  <button onclick="charaAction()" style="padding: 12px 25px; font-size: 1.2rem; background-color: #ff69b4; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">🎆 ド派手に祝う！</button>

  <!-- クイズコーナー -->
  <div class="card-container">
    <div class="section-header" id="quizNum">🧩 ママクイズ (1/3問) 🧩</div>
    <div class="quiz-question" id="quizQuestion">第1問：ママが一番好きな食べものはどれでしょう？</div>
    <div id="quizOptions"></div>
    <div id="quizResult"></div>
    <button id="nextBtn" class="btn-next" onclick="nextQuiz()">次の問題へ ➔</button>
  </div>

  <!-- 迷路コーナー（大人向け超難関版） -->
  <div class="card-container">
    <div class="section-header">🌀 お誕生日めいろ（超・難関プロ版） 🌀</div>
    <p style="font-size: 0.9rem; margin-bottom: 5px;">【大人向け難易度】スタート（🚩）からゴール（🎉）まで壁にぶつからずに辿り着けるか！？</p>

    <div class="maze-wrapper">
      <canvas id="mazeCanvas" width="372" height="372"></canvas>
    </div>
    <div id="mazeHint"></div>

    <button class="maze-btn" onclick="resetMaze()">🔄 やりなおす</button>
    <button class="maze-btn" onclick="newMaze()" style="background-color:#2ed573;">🆕 新しい極悪迷路</button>
    <div id="mazeResult"></div>
  </div>

  <script>
    // ====================================================
    // 🎆 1. ド派手な打ち上げ花火エフェクト
    // ====================================================
    const fwCanvas = document.getElementById('fireworksCanvas');
    const fwCtx = fwCanvas.getContext('2d');
    let fwWidth = fwCanvas.width = window.innerWidth;
    let fwHeight = fwCanvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      fwWidth = fwCanvas.width = window.innerWidth;
      fwHeight = fwCanvas.height = window.innerHeight;
    });

    let particles = [];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2; // 勢いよく弾ける
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008; // 徐々に消える
        this.gravity = 0.12; // 重力で下に落ちる
        this.size = Math.random() * 3 + 2;
      }

      update() {
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        fwCtx.save();
        fwCtx.globalAlpha = this.alpha;
        fwCtx.beginPath();
        fwCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        fwCtx.fillStyle = this.color;
        fwCtx.shadowBlur = 10;
        fwCtx.shadowColor = this.color;
        fwCtx.fill();
        fwCtx.restore();
      }
    }

    function createFirework(x, y) {
      const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#e84393', '#ffffff', '#eccc68'];
      const baseColor = colors[Math.floor(Math.random() * colors.length)];
      const particleCount = 120; // 粒子の数を増やしてド派手に

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle(x, y, baseColor));
      }
    }

    let animId = null;
    function animateFireworks() {
      fwCtx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // 残像を残して暗く演出
      fwCtx.fillRect(0, 0, fwWidth, fwHeight);

      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      if (particles.length > 0) {
        animId = requestAnimationFrame(animateFireworks);
      } else {
        fwCtx.clearRect(0, 0, fwWidth, fwHeight);
        cancelAnimationFrame(animId);
        animId = null;
      }
    }

    // 連続でどーんと打ち上げる関数
    function launchFireworks() {
      let count = 0;
      const interval = setInterval(() => {
        const x = fwWidth * (0.2 + Math.random() * 0.6);
        const y = fwHeight * (0.2 + Math.random() * 0.4);
        createFirework(x, y);
        if (!animId) animateFireworks();
        count++;
        if (count >= 7) clearInterval(interval); // 7連続でどーん！
      }, 250);
    }

    function charaAction() {
      const chara = document.getElementById('myChara');
      if (chara) {
        chara.classList.add('jump');
        setTimeout(() => chara.classList.remove('jump'), 500);
      }
      launchFireworks();
    }

    // ====================================================
    // 🧩 2. クイズの処理
    // ====================================================
    const quizData = [
      {
        question: "第1問：ママが一番好きな食べものはどれでしょう？",
        options: [
          { text: "1. ラーメン", correct: false },
          { text: "2. ハンバーグ", correct: true },
          { text: "3. お寿司", correct: false }
        ]
      },
      {
        question: "第2問：ママが一番好きな色は何色でしょう？",
        options: [
          { text: "1. ピンク", correct: true },
          { text: "2. 青", correct: false },
          { text: "3. きいろ", correct: false }
        ]
      },
      {
        question: "第3問：ママが休みにしたいことはどれでしょう？",
        options: [
          { text: "1. お買い物", correct: false },
          { text: "2. のんびりお昼寝", correct: true },
          { text: "3. お散歩", correct: false }
        ]
      }
    ];

    let currentQuiz = 0;

    function loadQuiz() {
      const q = quizData[currentQuiz];
      document.getElementById('quizNum').innerText = `🧩 ママクイズ (${currentQuiz + 1}/3問) 🧩`;
      document.getElementById('quizQuestion').innerText = q.question;
      const optionsDiv = document.getElementById('quizOptions');
      optionsDiv.innerHTML = "";
      document.getElementById('quizResult').innerText = "";
      document.getElementById('nextBtn').style.display = "none";

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "quiz-option";
        btn.innerText = opt.text;
        btn.onclick = () => checkAnswer(opt.correct);
        optionsDiv.appendChild(btn);
      });
    }

    function checkAnswer(isCorrect) {
      const result = document.getElementById('quizResult');
      if (isCorrect) {
        result.innerText = "大正解！🎉 すごい！";
        result.style.color = "#ff1493";
        charaAction();
        if (currentQuiz < quizData.length - 1) {
          document.getElementById('nextBtn').style.display = "inline-block";
        } else {
          result.innerText = "全問正解！🎉 ママ、いつもありがとう！！❤️";
        }
      } else {
        result.innerText = "ざんねん！もう一回かんがえてみてね！";
        result.style.color = "#dc143c";
      }
    }

    function nextQuiz() {
      currentQuiz++;
      loadQuiz();
    }

    loadQuiz();

    // ====================================================
    // 🌀 3. 大人向け・超難関迷路（31x31高密度）
    // ====================================================
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const MAZE_SIZE = 31; // 15から31へ拡大（超難関）
    const cellSize = canvas.width / MAZE_SIZE;
    const startCell = { x: 1, y: 1 };
    const goalCell = { x: MAZE_SIZE - 2, y: MAZE_SIZE - 2 };

    let grid = [];
    let isDrawing = false;
    let isCleared = false;
    let lastCell = null;

    // 穴掘り法（深さ優先探索で複雑で長距離のコースを生成）
    function generateMaze(size) {
      const g = Array.from({ length: size }, () => Array(size).fill(1));

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function carve(cx, cy) {
        g[cy][cx] = 0;
        const dirs = shuffle([[0, -2], [0, 2], [-2, 0], [2, 0]]);
        for (const [dx, dy] of dirs) {
          const nx = cx + dx;
          const ny = cy + dy;
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && g[ny][nx] === 1) {
            g[cy + dy / 2][cx + dx / 2] = 0;
            carve(nx, ny);
          }
        }
      }

      carve(startCell.x, startCell.y);
      g[goalCell.y][goalCell.x] = 0;
      return g;
    }

    function drawMaze() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < MAZE_SIZE; r++) {
        for (let c = 0; c < MAZE_SIZE; c++) {
          ctx.fillStyle = grid[r][c] === 1 ? "#34495e" : "#ffffff"; // 壁を黒っぽくして難易度の高さを視覚強調
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }

      // スタートとゴール
      ctx.font = Math.floor(cellSize * 1.2) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🚩", startCell.x * cellSize + cellSize / 2, startCell.y * cellSize + cellSize / 2);
      ctx.fillText("🎉", goalCell.x * cellSize + cellSize / 2, goalCell.y * cellSize + cellSize / 2);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX, clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function cellAt(pos) {
      return {
        cx: Math.floor(pos.x / cellSize),
        cy: Math.floor(pos.y / cellSize)
      };
    }

    function isFloor(cx, cy) {
      return cx >= 0 && cx < MAZE_SIZE && cy >= 0 && cy < MAZE_SIZE && grid[cy][cx] === 0;
    }

    function startDrawing(e) {
      if (isCleared) return;
      const pos = getPos(e);
      const { cx, cy } = cellAt(pos);

      if (Math.abs(cx - startCell.x) <= 1 && Math.abs(cy - startCell.y) <= 1 && isFloor(cx, cy)) {
        isDrawing = true;
        lastCell = { cx, cy };
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = "#ff1493";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
      }
    }

    function draw(e) {
      if (!isDrawing || isCleared) return;
      if (e.cancelable) e.preventDefault();

      const pos = getPos(e);
      const { cx, cy } = cellAt(pos);

      if (isFloor(cx, cy)) {
        if (lastCell === null) {
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        } else {
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        }
        lastCell = { cx, cy };

        if (cx === goalCell.x && cy === goalCell.y) {
          isDrawing = false;
          isCleared = true;
          document.getElementById('mazeResult').innerText = "🏆 超難関迷路クリア！お見事です！！ 🏆";
          document.getElementById('mazeHint').innerText = "";
          launchFireworks();
        }
      } else {
        lastCell = null;
        document.getElementById('mazeHint').innerText = "⚠️ 壁に接触！慎重に進んでください！";
        clearTimeout(window._mazeHintTimer);
        window._mazeHintTimer = setTimeout(() => {
          document.getElementById('mazeHint').innerText = "";
        }, 1200);
      }
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function resetMaze() {
      isCleared = false;
      lastCell = null;
      document.getElementById('mazeResult').innerText = "";
      document.getElementById('mazeHint').innerText = "";
      drawMaze();
    }

    function newMaze() {
      grid = generateMaze(MAZE_SIZE);
      resetMaze();
    }

    // イベント登録（マウス & タッチ）
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    newMaze();
  </script>

</body>
</html>
