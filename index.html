<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ママお誕生日おめでとう！</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    body {
      text-align: center;
      background-color: #fff0f5;
      font-family: sans-serif;
      padding-bottom: 50px;
    }
    /* キャラクターのスタイル設定 */
    .character {
      width: 120px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    /* 跳ねるアニメーションクラス */
    .jump {
      animation: jump-up 0.5s ease;
    }
    @keyframes jump-up {
      0%   { transform: translateY(0) scale(1); }
      50%  { transform: translateY(-50px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }

    /* 追加：クイズコーナーのスタイル */
    .quiz-container {
      max-width: 500px;
      margin: 40px auto 20px;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .quiz-title {
      color: #ff69b4;
      font-size: 1.3rem;
      margin-bottom: 15px;
    }
    .quiz-option {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 1rem;
      background-color: #ffe4e1;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .quiz-option:hover {
      background-color: #ffc0cb;
    }
    #quizResult {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.2rem;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

  <h1>ママ、お誕生日おめでとう！</h1>

  <!-- キャラクター画像（クリックしても跳ねます） -->
  <div>
    <img id="myChara" class="character" src="https://api.iconify.design/noto:cat-face.svg" alt="ねこちゃん" onclick="charaAction()">
  </div>

  <p>ねこちゃんをタップするか、ボタンを押してね！</p>
  <button onclick="charaAction()" style="padding: 10px 20px; font-size: 1.2rem;">🎆 お祝いする！</button>

  <!-- 追加：クイズコーナー -->
  <div class="quiz-container">
    <div class="quiz-title">🧩 ママクイズ 🧩</div>
    <p>ママが一番好きな食べものはどれでしょう？</p>
    
    <!-- checkAnswer(true) が正解、checkAnswer(false) が不正解です -->
    <button class="quiz-option" onclick="checkAnswer(false)">1. ラーメン</button>
    <button class="quiz-option" onclick="checkAnswer(true)">2. ハンバーグ</button>
    <button class="quiz-option" onclick="checkAnswer(false)">3. お寿司</button>

    <div id="quizResult"></div>
  </div>

  <script>
    function charaAction() {
      const chara = document.getElementById('myChara');
      
      // ジャンプアニメーションを適用
      chara.classList.add('jump');
      
      // 花火をあげる
      confetti({ particleCount: 80, spread: 60 });

      // アニメーションが終わったらクラスを外す（再度押せるようにする）
      setTimeout(() => {
        chara.classList.remove('jump');
      }, 500);
    }

    /* 追加：クイズ判定処理 */
    function checkAnswer(isCorrect) {
      const result = document.getElementById('quizResult');
      if (isCorrect) {
        result.innerText = "大正解！🎉 おめでとう！";
        result.style.color = "#ff1493";
        // 正解したときもねこちゃんが跳ねて花火が上がる
        charaAction();
      } else {
        result.innerText = "ざんねん！もう一回かんがえてみてね！";
        result.style.color = "#dc143c";
      }
    }
  </script>

</body>
</html>
